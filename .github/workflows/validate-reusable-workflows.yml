name: Workflow validation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ci:
    uses: ./.github/workflows/dotnet-ci.yml
    with:
      project: tests/workflow-smoke/Smoke.slnx
      dotnet-version: 10.0.x
  delivery:
    needs: ci
    uses: ./.github/workflows/dotnet-delivery.yml
    with:
      project: tests/workflow-smoke/Smoke.slnx
      publish-project: tests/workflow-smoke/App/SmokeApp.csproj
      dotnet-version: 10.0.x
  verify-delivery:
    needs: delivery
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: application-${{ github.sha }}-${{ github.run_attempt }}
          path: delivery
      - name: Verify delivered application runs
        shell: bash
        run: test "$(dotnet delivery/SmokeApp.dll)" = "WHITEBEARD_WORKFLOW_SMOKE_OK"
  gate:
    name: workflow-validation
    if: ${{ always() }}
    needs: [ci, delivery, verify-delivery]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CI_RESULT: ${{ needs.ci.result }}
      DELIVERY_RESULT: ${{ needs.delivery.result }}
      VERIFICATION_RESULT: ${{ needs.verify-delivery.result }}
    steps:
      - name: Require every workflow validation job to succeed
        shell: bash
        run: test "$CI_RESULT" = success && test "$DELIVERY_RESULT" = success && test "$VERIFICATION_RESULT" = success
