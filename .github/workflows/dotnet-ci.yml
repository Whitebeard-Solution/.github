name: Reusable .NET CI
on:
  workflow_call:
    inputs:
      project:
        description: Solution or project path relative to repository root
        required: true
        type: string
      dotnet-version:
        description: Supported SDK version matching the consuming repository
        required: true
        type: string
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROJECT: ${{ inputs.project }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
      - name: Restore
        run: dotnet restore "$PROJECT"
      - name: Build
        run: dotnet build "$PROJECT" --configuration Release --no-restore
      - name: Check formatting
        run: dotnet format "$PROJECT" --verify-no-changes --no-restore
      - name: Test
        run: dotnet test "$PROJECT" --configuration Release --no-build --logger trx --results-directory TestResults
      - name: Preserve test results
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dotnet-test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: TestResults/**/*.trx
          if-no-files-found: warn
          retention-days: 7
